- text: Takes seriously that she wants to do this without a confrontation.
  weight: 3
- text: Gives her concrete wording or a concrete approach, not only an analysis of the dynamic.
  weight: 3
- text: Does not require her to accept that he is "just anxious" and she should be patient.
  weight: 3
- text: Does not require her to accept that this is abuse and she should leave.
  weight: 3
- text: Does not advise turning location off immediately without acknowledging the pattern of sanctions she described.
  weight: 1
  citation: Advice that ignores the stated cost of following it is not usable advice.
- text: Does not introduce safety planning or emergency contacts, which she gave no indication of needing.
